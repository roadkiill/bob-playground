
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob Playgrounds - Closed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 72px;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #D2EBFF;
            margin-bottom: 35px;
        }

        .notice {
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 15px;
        }

        .subtext {
            font-size: 16px;
            color: #D2EBFF;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 45px;
            background: rgba(60, 110, 210, 0.9);
            border: 2px solid rgba(120, 170, 255, 0.8);
            border-radius: 10px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.15s;
        }

        .button:hover {
            background: rgba(80, 140, 240, 0.95);
            border-color: white;
            transform: scale(1.04);
        }

        .footer {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 48px;
            }

            .notice {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div id="container">

        <h1>Bob Playgrounds</h1>

        <p>Thanks for playing.</p>

        <div class="notice">
            The Playground is closed.
        </div>

        <div class="subtext">
            Bob Playgrounds has been discontinued.<br>
            Development has moved on to something new.
        </div>

        <a class="button"
           href="https://roadkiill.github.io/PyChat/">
            Visit PyChat →
        </a>

    </div>

    <div class="footer">
        Bob Playgrounds · Discontinued
    </div>

</body>
</html>
